name: Android Build

# Workflow ishga tushish hodisalari:
#   • push — barcha branch'larga, debug APK yiqiladi
#   • pull_request — main/master ga, analyze + debug build
#   • workflow_dispatch — qo'lda ishga tushirish (release uchun)
#   • tag (v*.*.*) — release APK + AAB build qilinadi
on:
  push:
    branches:
      - mark
      - main
      - master
      - "release/**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
      - mark
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build turi"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

# Bir vaqtda bitta workflow run; yangi push eski runni bekor qiladi
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"
  WORKING_DIR: patirchi

jobs:
  # ==========================================================================
  # 1. Static analysis + tests (har push/PR'da)
  # ==========================================================================
  analyze:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.WORKING_DIR }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Verify formatting
        working-directory: ${{ env.WORKING_DIR }}
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true # warning only — formatlash CI ni bloklamasin

      - name: Static analysis
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter test --reporter expanded
        continue-on-error: true # tests hali yo'q — fail qilmasin

  # ==========================================================================
  # 2. Debug APK (har push/PR'da)
  # ==========================================================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 25
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-debug-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          compression-level: 0 # APK allaqachon siqilgan

  # ==========================================================================
  # 3. Release build (tag yoki manual)
  # ==========================================================================
  build-release:
    name: Build Release (APK + AAB)
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    environment: production # GitHub environment protection (optional)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      # ----- Keystore va sozlamalarni secrets'dan tiklash -----
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret o'rnatilmagan!"
            exit 1
          fi
          mkdir -p ${{ env.WORKING_DIR }}/android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ env.WORKING_DIR }}/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > ${{ env.WORKING_DIR }}/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # ----- Build artefact'lar -----
      - name: Build release APK (split per ABI)
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB (Play Store uchun)
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build appbundle --release

      # ----- Tozalash (sensitive ma'lumotlar) -----
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ${{ env.WORKING_DIR }}/android/app/upload-keystore.jks
          rm -f ${{ env.WORKING_DIR }}/android/key.properties

      # ----- Artifact'larni yuklash -----
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-release-apks-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 90
          compression-level: 0

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-release-aab-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          compression-level: 0

      # ----- GitHub Release ga ilova qilish (faqat tag'da) -----
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-*-release.apk
            ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
