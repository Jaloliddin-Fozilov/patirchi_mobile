name: Android Build

# ============================================================================
# Trigger sharhlari:
#   • push     — branch'larga, debug APK
#   • PR       — security uchun GitHub-hosted runner (self-hosted emas)
#   • dispatch — qo'lda ishga tushirish (debug yoki release)
#   • tag      — release APK + AAB + GitHub Release ga ilova
#
# Build server: o'z self-hosted runnerimizda (label: patirchi-builder)
# APK/AAB: build tugagach Telegram bot orqali yuboriladi
# ============================================================================
on:
  push:
    branches:
      - mark
      - main
      - master
      - "release/**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
      - mark
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build turi"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      send_telegram:
        description: "Telegram'ga yuborilsinmi?"
        required: false
        default: true
        type: boolean

# Bir vaqtda bitta workflow run; yangi push eski runni bekor qiladi
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: patirchi
  # Self-hosted runner'da Flutter + Java pre-installed bo'ladi (PATH'da)
  # GitHub-hosted (PR uchun) — subosito/flutter-action avtomatik o'rnatadi
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  # ==========================================================================
  # 1. Static analysis + tests
  # PR'lar uchun GitHub-hosted (security), boshqalar uchun self-hosted
  # ==========================================================================
  analyze:
    name: Analyze + Test
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "patirchi-builder"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (GitHub-hosted only)
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter (GitHub-hosted only)
        if: github.event_name == 'pull_request'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter (self-hosted)
        if: github.event_name != 'pull_request'
        run: |
          flutter --version
          java -version

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Verify formatting
        working-directory: ${{ env.WORKING_DIR }}
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Static analysis
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter test --reporter expanded
        continue-on-error: true

  # ==========================================================================
  # 2. Debug APK — har push, self-hosted server'da
  # ==========================================================================
  build-debug:
    name: Build Debug APK
    runs-on: [self-hosted, linux, patirchi-builder]
    needs: analyze
    timeout-minutes: 25
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build apk --debug

      - name: Get build info
        id: build_info
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: //')
          echo "apk_path=${{ env.WORKING_DIR }}/$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-debug-${{ github.sha }}
          path: ${{ steps.build_info.outputs.apk_path }}
          retention-days: 14
          compression-level: 0

      # ----------------------------------------------------------------------
      # Telegram delivery — debug APK
      # 1) Avval admin chatga upload qilamiz va `file_id` ni olamiz.
      # 2) Backend'ni chaqirib, file_id ni barcha userlarga broadcast qilamiz.
      # ----------------------------------------------------------------------
      - name: Send debug APK to Telegram + broadcast
        if: |
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.send_telegram == true))
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_BUILD_CHAT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APK_PATH: ${{ steps.build_info.outputs.apk_path }}
          VERSION: ${{ steps.build_info.outputs.version }}
          APK_SIZE: ${{ steps.build_info.outputs.apk_size }}
          SHORT_SHA: ${{ steps.build_info.outputs.short_sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN yoki TELEGRAM_BUILD_CHAT_ID o'rnatilmagan, skip qilinadi"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 200)

          CAPTION="🔨 *Patirchi Debug Build*
          📦 Version: \`$VERSION\`
          🌿 Branch: \`$BRANCH\`
          🔖 Commit: \`$SHORT_SHA\`
          👤 By: $ACTOR
          📏 Size: $APK_SIZE
          💬 _${COMMIT_MSG}_"

          # Step 1: Upload to admin chat, capture file_id
          echo "📤 APK admin chat'ga yuklanmoqda..."
          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${CAPTION}" \
            -F parse_mode="Markdown")

          FILE_ID=$(echo "$RESPONSE" | jq -r '.result.document.file_id // empty')

          if [ -z "$FILE_ID" ]; then
            echo "::warning::file_id olinmadi, broadcast skip"
            echo "Response: $RESPONSE" | head -c 500
            exit 0
          fi

          echo "✅ Admin chatga yuborildi (file_id=${FILE_ID:0:30}...)"

          # Step 2: Trigger backend broadcast (agar konfiguratsiya bo'lsa)
          if [ -z "$BACKEND_URL" ] || [ -z "$INTERNAL_API_KEY" ]; then
            echo "ℹ️  BACKEND_URL/INTERNAL_API_KEY o'rnatilmagan, broadcast skip"
            exit 0
          fi

          echo "📡 Barcha userlarga broadcast trigger qilinmoqda..."
          BROADCAST_RESPONSE=$(curl -sS -X POST \
            "${BACKEND_URL%/}/api/v1/internal/broadcast-apk/" \
            -H "X-API-Key: ${INTERNAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg fid "$FILE_ID" \
              --arg cap "$CAPTION" \
              --arg ver "$VERSION" \
              --arg com "$SHORT_SHA" \
              '{file_id:$fid, caption:$cap, version:$ver, commit:$com, build_type:"debug"}')")

          echo "📊 Backend javobi: $BROADCAST_RESPONSE"
          TASK_ID=$(echo "$BROADCAST_RESPONSE" | jq -r '.task_id // empty')
          TOTAL=$(echo "$BROADCAST_RESPONSE" | jq -r '.total_subscribers // 0')

          if [ -n "$TASK_ID" ]; then
            echo "✅ Broadcast queued: task=$TASK_ID, subscribers=$TOTAL"
          else
            echo "::warning::Broadcast trigger muvaffaqiyatsiz"
          fi

  # ==========================================================================
  # 3. Release build — tag yoki manual
  # ==========================================================================
  build-release:
    name: Build Release (APK + AAB)
    runs-on: [self-hosted, linux, patirchi-builder]
    needs: analyze
    timeout-minutes: 30
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter pub get
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      # ----- Keystore va sozlamalarni secrets'dan tiklash -----
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret o'rnatilmagan!"
            exit 1
          fi
          mkdir -p ${{ env.WORKING_DIR }}/android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ env.WORKING_DIR }}/android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > ${{ env.WORKING_DIR }}/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # ----- Build artefact'lar -----
      - name: Build release APK (split per ABI)
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB (Play Store uchun)
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build appbundle --release

      - name: Get build info
        id: build_info
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: //')
          AAB_SIZE=$(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          # ABI APK ro'yxati
          echo "apk_arm32=${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" >> $GITHUB_OUTPUT
          echo "apk_arm64=${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" >> $GITHUB_OUTPUT
          echo "apk_x64=${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-x86_64-release.apk" >> $GITHUB_OUTPUT
          echo "aab_path=${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT

      # ----- Artifact'larni yuklash -----
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-release-apks-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 90
          compression-level: 0

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: patirchi-release-aab-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          compression-level: 0

      # ----- GitHub Release ga ilova qilish (faqat tag'da) -----
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-*-release.apk
            ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Telegram delivery — release APK'lar (har bir ABI)
      # ----------------------------------------------------------------------
      - name: Send release APKs to Telegram + broadcast
        if: |
          inputs.send_telegram != false
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_BUILD_CHAT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          VERSION: ${{ steps.build_info.outputs.version }}
          SHORT_SHA: ${{ steps.build_info.outputs.short_sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          APK_ARM64: ${{ steps.build_info.outputs.apk_arm64 }}
          APK_ARM32: ${{ steps.build_info.outputs.apk_arm32 }}
          APK_X64: ${{ steps.build_info.outputs.apk_x64 }}
          AAB_PATH: ${{ steps.build_info.outputs.aab_path }}
          AAB_SIZE: ${{ steps.build_info.outputs.aab_size }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Telegram secrets yo'q, skip"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 200)

          # Header xabar
          HEADER="🚀 *Patirchi Release Build*
          📦 Version: \`$VERSION\`
          🌿 Branch: \`$BRANCH\`
          🔖 Commit: \`$SHORT_SHA\`
          👤 By: $ACTOR
          💬 _${COMMIT_MSG}_

          📦 Yuborilayotgan fayllar:
          • ARM64 APK (zamonaviy qurilmalar)
          • ARM32 APK (eski qurilmalar)
          • x86_64 APK (emulyator)
          • AAB ($AAB_SIZE — Play Store uchun)"

          curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${HEADER}" \
            -d parse_mode="Markdown" > /dev/null

          # Har bir APK alohida yuboriladi (chunki Telegram bot 50MB cheklov)
          send_file() {
            local FILE="$1"
            local LABEL="$2"
            if [ ! -f "$FILE" ]; then
              echo "⚠️  $FILE topilmadi, skip"
              return
            fi
            SIZE=$(du -h "$FILE" | cut -f1)
            echo "📤 $LABEL ($SIZE) yuborilmoqda..."
            curl -sS --fail -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${FILE}" \
              -F caption="📱 *${LABEL}* — \`v${VERSION}\` (${SIZE})" \
              -F parse_mode="Markdown" \
              > /dev/null && echo "✅ $LABEL yuborildi" || echo "::warning::$LABEL yuborilmadi"
          }

          # Admin chatga yuborish + ARM64 file_id ni ushlab qolish (broadcast uchun)
          ARM64_FILE_ID=""
          send_file_capture() {
            local FILE="$1"
            local LABEL="$2"
            if [ ! -f "$FILE" ]; then
              echo "⚠️  $FILE topilmadi, skip"
              return
            fi
            SIZE=$(du -h "$FILE" | cut -f1)
            echo "📤 $LABEL ($SIZE) yuborilmoqda..."
            RESP=$(curl -sS -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${FILE}" \
              -F caption="📱 *${LABEL}* — \`v${VERSION}\` (${SIZE})" \
              -F parse_mode="Markdown")
            local FID=$(echo "$RESP" | jq -r '.result.document.file_id // empty')
            if [ -n "$FID" ]; then
              echo "✅ $LABEL yuborildi"
              # ARM64 — eng keng tarqalgan ABI, broadcast uchun ishlatamiz
              if [ "$LABEL" = "ARM64 APK" ]; then
                ARM64_FILE_ID="$FID"
              fi
            else
              echo "::warning::$LABEL yuborilmadi"
            fi
          }

          send_file_capture "$APK_ARM64" "ARM64 APK"
          send_file_capture "$APK_ARM32" "ARM32 APK"
          send_file_capture "$APK_X64" "x86_64 APK"

          # AAB faqat 50MB dan kichik bo'lsa yuboriladi
          AAB_BYTES=$(stat -c%s "$AAB_PATH" 2>/dev/null || stat -f%z "$AAB_PATH")
          if [ "$AAB_BYTES" -lt 52428800 ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${AAB_PATH}" \
              -F caption="📦 *App Bundle (AAB)* — \`v${VERSION}\` (${AAB_SIZE})" \
              -F parse_mode="Markdown" > /dev/null && echo "✅ AAB yuborildi"
          else
            curl -sS -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="⚠️ AAB ($AAB_SIZE) Telegram cheklovidan oshdi (50MB). GitHub artifacts'dan yuklab oling." > /dev/null
          fi

          # ====== Broadcast — barcha userlarga ARM64 APK ======
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${INTERNAL_API_KEY:-}" ]; then
            echo "ℹ️  BACKEND_URL/INTERNAL_API_KEY yo'q, broadcast skip"
            exit 0
          fi

          if [ -z "$ARM64_FILE_ID" ]; then
            echo "::warning::ARM64 file_id yo'q, broadcast skip"
            exit 0
          fi

          BCAST_CAPTION="🚀 *Patirchi Yangi Versiya!*
          📦 Version: \`$VERSION\`
          🔖 Build: \`$SHORT_SHA\`

          Yuklab oling va o'rnating 👇"

          echo "📡 Barcha userlarga broadcast..."
          RESP=$(curl -sS -X POST \
            "${BACKEND_URL%/}/api/v1/internal/broadcast-apk/" \
            -H "X-API-Key: ${INTERNAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg fid "$ARM64_FILE_ID" \
              --arg cap "$BCAST_CAPTION" \
              --arg ver "$VERSION" \
              --arg com "$SHORT_SHA" \
              '{file_id:$fid, caption:$cap, version:$ver, commit:$com, build_type:"release"}')")

          TASK_ID=$(echo "$RESP" | jq -r '.task_id // empty')
          TOTAL=$(echo "$RESP" | jq -r '.total_subscribers // 0')

          if [ -n "$TASK_ID" ]; then
            echo "✅ Release broadcast queued: task=$TASK_ID, subscribers=$TOTAL"
          else
            echo "::warning::Broadcast trigger muvaffaqiyatsiz: $RESP"
          fi

      # ----- Tozalash (sensitive ma'lumotlar) — har doim, hatto fail bo'lsa ham -----
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ${{ env.WORKING_DIR }}/android/app/upload-keystore.jks
          rm -f ${{ env.WORKING_DIR }}/android/key.properties
          # Build artefact'larni ham tozalash (disk space)
          rm -rf ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/*.apk || true
          rm -rf ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/*.aab || true
