# Gradle JVM heap — kichik VPS uchun moslashtirilgan (3.8GB total RAM).
# 1.5G heap kichik Flutter loyihasi uchun yetarli; 3G+ OOM ga olib keladi.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Daemon — keyingi build'larda warm JVM ishlatadi
org.gradle.daemon=true

# Parallel — RAM tejash uchun OFF (kichik loyihada foyda kam, RAM ko'p ketadi)
org.gradle.parallel=false

# Configure-on-demand: faqat o'zgarishlarga ta'sir qiluvchi modullarni configure qiladi
org.gradle.configureondemand=true

# Caching — incremental build'larda foyda
org.gradle.caching=true

# Workers cheklash — RAM siqilganda bitta worker yetadi
org.gradle.workers.max=1

android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon kichikroq heap (512M debug build uchun yetarli)
kotlin.daemon.jvmargs=-Xmx512m

# Kotlin parallel kompilyatsiya OFF — RAM tejash
kotlin.parallel.tasks.in.project=false
