# Gradle JVM heap — server RAM bilan moslashtirilgan.
# 3GB heap kichik-o'rta Flutter loyihalar uchun yetarli; 8GB default OOM ga olib keladi.
# MaxMetaspaceSize 1G ham yetarli (default tahlil bo'ldi).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Daemon — keyingi build'larda warm JVM ishlatadi, RAM tejaydi
org.gradle.daemon=true

# Parallel ishlash (lekin moduli oz bo'lgani uchun ko'p foyda yo'q)
org.gradle.parallel=true

# Configuration cache — Gradle 8+ feature, build configuration'ni keshlaydi
org.gradle.caching=true

# Configure-on-demand: faqat o'zgarishlarga ta'sir qiluvchi modullarni configure qiladi
org.gradle.configureondemand=true

android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon — kichikroq heap (default 2G da OOM bo'lishi mumkin)
kotlin.daemon.jvmargs=-Xmx1G
